@if (session.status() === 'playing') {
  <main class="playing">
    <app-settings-strip
      [settings]="session.settings()"
      [countIn]="session.countIn()"
      [ramp]="session.ramp()"
      (stop)="onStop()"
    />
    <app-beat-display
      class="display"
      [event]="session.current()"
      [startBpm]="session.settings().startBpm ?? 0"
      [step]="session.settings().step ?? 0"
      [ramp]="session.ramp()"
    />
  </main>
} @else {
  <main class="idle">
    <app-settings-form
      [settings]="session.settings()"
      (settingsChange)="onSettingsChange($event)"
      [countIn]="session.countIn()"
      (countInChange)="session.setCountIn($event)"
      [ramp]="session.ramp()"
      (rampChange)="session.setRamp($event)"
      [extraHint]="session.audioError()"
      (start)="onStart()"
    />
    <app-song-library (songSelect)="onSongSelect($event)" />
  </main>
}
